name: Release

on:
  push:
    tags: ["*/v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - run: sh scripts/install-tools.sh
      - run: sh scripts/release-check.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          # tflint --init reads GitHub releases; anonymous calls hit rate limits on shared runners.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  # Separate job so only this step, which runs no repo code, gets write access.
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      # --verify-tag stops gh from creating the tag if it's missing.
      - run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
